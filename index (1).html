<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaid Mughal - Bio Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* --- Global Styles and Dark Theme --- */
        body {
            background-color: #0d0d0d; /* Very dark background */
            color: #f0f0f0; /* Light text color */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .bio-container {
            width: 100%;
            max-width: 600px; /* Max width for a clean look on desktop */
            padding: 20px;
        }

        /* --- Profile Card Styling --- */
        .profile-card {
            background-color: #1a1a1a; /* Darker card background */
            padding: 30px 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); /* Subtle shadow */
        }

        .profile-image-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #666; /* Border around the image */
        }

        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-card h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .location {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 1em;
            color: #ffb84d; /* A subtle accent color for the tagline */
            font-weight: 500;
            margin-bottom: 25px;
        }

        /* --- Contact Buttons --- */
        .contact-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            color: #f0f0f0;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 0.9em;
            transition: background-color 0.3s ease;
        }

        .email-btn {
            background-color: #444;
        }

        .call-btn {
            background-color: #444;
        }

        .email-btn:hover, .call-btn:hover {
            background-color: #555;
        }

        /* --- Social Links Styling --- */
        .social-links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #1a1a1a;
            border-radius: 10px;
            text-decoration: none;
            color: #f0f0f0;
            font-size: 1.1em;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            /* Set up for the hover animation */
            transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .icon-text {
            display: flex;
            align-items: center;
        }

        .icon {
            font-size: 1.4em;
            margin-right: 15px;
        }

        .arrow {
            font-size: 1em;
            color: #aaa;
            transition: transform 0.3s ease; /* For arrow animation */
        }

        /* --- Color Coding for Icons (TikTok color is set to Red/Magenta: #EE1D52) --- */
        .instagram .icon { color: #fd1d1d; }
        .snapchat .icon { color: #ffeb00; }
        .whatsapp .icon { color: #25d366; }
        .tiktok .icon { color: #EE1D52; } 
        .email .icon { color: #4285f4; }

        /* --- HOVER ANIMATION --- */
        .link-item:hover {
            /* Scale effect on hover */
            transform: translateY(-3px); 
            background-color: #262626; /* Slightly lighter background on hover */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5); /* More prominent shadow */
        }

        .link-item:hover .arrow {
            /* Subtle arrow movement */
            transform: translateX(5px);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="bio-container">
        <div class="profile-card">
            <div class="profile-image-container">
                <img src="profile.jpg" alt="Zaid Mughal" class="profile-image">
            </div>
            <h1>Zaid Mughal</h1>
            <p class="location"><i class="fas fa-map-marker-alt"></i> Sangla Hill, Punjab Pakistan</p>
            <p class="tagline">A Passionate Graphic Designer</p>

            <div class="contact-buttons">
                <a href="mailto:zaidbilal216@gmail.com" class="btn email-btn">
                    <i class="fas fa-envelope"></i> Email
                </a>
                <a href="tel:+923334807064" class="btn call-btn">
                    <i class="fas fa-phone-alt"></i> Call
                </a>
            </div>
        </div>

        <div class="social-links-container">
            <a href="https://www.instagram.com/zaidahmed_14/?igsh=YzIxYTkwODg9Zg==" target="_blank" class="link-item instagram">
                <div class="icon-text">
                    <i class="fab fa-instagram icon"></i>
                    <span>Instagram</span>
                </div>
                <span class="arrow"><i class="fas fa-arrow-right"></i></span>
            </a>

            <a href="https://snapchat.com/add/zaidmughal_14?share_id=R..." target="_blank" class="link-item snapchat">
                <div class="icon-text">
                    <i class="fab fa-snapchat-ghost icon"></i>
                    <span>Snapchat</span>
                </div>
                <span class="arrow"><i class="fas fa-arrow-right"></i></span>
            </a>

            <a href="https://wa.me/923334807064?text=Hk%20Zaid%20..." target="_blank" class="link-item whatsapp">
                <div class="icon-text">
                    <i class="fab fa-whatsapp icon"></i>
                    <span>WhatsApp</span>
                </div>
                <span class="arrow"><i class="fas fa-arrow-right"></i></span>
            </a>
            
            <a href="https://tiktok.com/@zaidmughal_l4" target="_blank" class="link-item tiktok">
                <div class="icon-text">
                    <i class="fab fa-tiktok icon"></i>
                    <span>TikTok</span>
                </div>
                <span class="arrow"><i class="fas fa-arrow-right"></i></span>
            </a>

            <a href="mailto:zaidbilal216@gmail.com" class="link-item email">
                <div class="icon-text">
                    <i class="fas fa-envelope icon"></i>
                    <span>Email</span>
                </div>
                <span class="arrow"><i class="fas fa-arrow-right"></i></span>
            </a>

        </div>
    </div>
</body>
</html>
